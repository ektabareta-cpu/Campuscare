<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CampusCare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f1f5fb;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #123b70;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #123b70;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2875c7;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #123b70;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join CampusCare today
        </p>
        {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <p style="background-color: #e8f3ff;
                      color: #123b70;
                      padding: 12px;
                      margin-bottom: 15px;
                      border-radius: 5px;
                      text-align: center;">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}
{% endwith %}

        <form action="/register" method="POST">

            <label>Full Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <label>Register As</label>
            <select name="role" required>
                <option value="student">Student</option>
                <option value="staff">Staff</option>
            </select>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <a class="home-link" href="/">
            Back to Home
        </a>

    </div>

</body>
</html>
